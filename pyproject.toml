[project]
name = "cite-desk"
version = "0.1.0"
description = "Retrieval-augmented answers over real legal texts: hybrid search, reranking, cite-or-refuse, measured with evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "numpy>=1.26",
  "fastembed>=0.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
llm = ["anthropic>=0.80"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
